spring.application.name=court-service
# Port 8081 because 8080 is taken by Auth Service!
server.port=8081

# Connect to the NEW database
spring.datasource.url=jdbc:postgresql://localhost:5432/badmintoz_court
spring.datasource.username=admin
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Force Eureka to use IP/Localhost instead of the computer name
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost