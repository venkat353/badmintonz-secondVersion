name: Backend CI Pipeline

# Trigger this workflow on every push to the 'main' branch
on:
  push:
    branches: [ "main", "venkat" ]  # <--- Add your branch here
  pull_request:
    branches: [ "main", "venkat" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Borrow a Linux machine

    steps:
      # 1. Download your code onto the machine
      - uses: actions/checkout@v4

      # 2. Install Java 21 (Temurin)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven # Caches libraries so builds are faster next time

      # 3. Run Tests for Auth Service
      - name: Test Auth Service
        run: mvn -B test --file backend/auth-service/pom.xml

      # 4. (Optional) Compile Court Service just to check for syntax errors
      - name: Compile Court Service
        run: mvn -B compile --file backend/court-service/pom.xml