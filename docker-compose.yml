services:
  # 1. Database (We create a fresh DB inside Docker)
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: badmintoz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Service Registry (The Phonebook)
  service-registry:
    image: badmintoz-registry:latest
    container_name: service-registry
    ports:
      - "8761:8761"
    depends_on:
      - postgres

  # 3. Auth Service
  auth-service:
    image: badmintoz-auth:latest
    container_name: auth-service
    ports:
      - "8080:8080"
    environment:
      # Override the DB URL to point to the 'postgres' container defined above
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/badmintoz
      # Override Eureka URL to point to 'service-registry' container
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      - service-registry
      - postgres

  # 4. Court Service
  court-service:
    image: badmintoz-court:latest
    container_name: court-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/badmintoz
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      - service-registry
      - postgres

  # 5. API Gateway (The Door)
  api-gateway:
    image: badmintoz-gateway:latest
    container_name: api-gateway
    ports:
      - "8082:8082"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    depends_on:
      - service-registry
      - auth-service
      - court-service

  # 6. Frontend (The UI)
  frontend:
    image: badmintoz-frontend:latest
    container_name: frontend-ui
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway

# Define the storage volume for the DB so data persists
volumes:
  postgres_data: